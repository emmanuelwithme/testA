name: V80 Formal ETF Backtest
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'v80_backtest.py'
      - 'v80_nato_backtest.py'
      - 'v80_halfyear_cohorts.py'
      - 'v80_nato_halfyear_cohorts.py'
      - 'v80_macro.py'
      - 'v80_runaway_audit.py'
      - 'V80.md'
      - '.github/workflows/v80_backtest.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance requests scikit-learn
      - name: Patch shared runtime compatibility and V80 macro source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('investment_backtest.py'); s=p.read_text()
          s=s.replace("repair=True,timeout=30","repair=False,timeout=60")
          old="def asof_cols(base,other,prefix,cols):\n    tmp=other[cols].copy();tmp.columns=[prefix+c for c in cols];return pd.merge_asof(base.sort_index().reset_index().rename(columns={'index':'date'}),tmp.sort_index().reset_index().rename(columns={'index':'date'}),on='date',direction='backward').set_index('date')"
          new="def asof_cols(base,other,prefix,cols):\n    left=base.sort_index().copy(); left.index.name='date'; left=left.reset_index()\n    tmp=other[cols].copy(); tmp.columns=[prefix+c for c in cols]; tmp.index.name='date'; tmp=tmp.sort_index().reset_index()\n    left['date']=pd.to_datetime(left['date']); tmp['date']=pd.to_datetime(tmp['date'])\n    return pd.merge_asof(left.sort_values('date'),tmp.sort_values('date'),on='date',direction='backward').set_index('date')"
          if old in s: s=s.replace(old,new)
          p.write_text(s)
          p=Path('v80_backtest.py'); s=p.read_text()
          s=s.replace("from investment_backtest import get_prices, build_macro, add_indicators, period_bars, asof_cols","from investment_backtest import get_prices, add_indicators, period_bars, asof_cols\nfrom v80_macro import build_macro_v80 as build_macro")
          p.write_text(s)
          PY
      - name: Run V80 formal validation including dedicated NATO defence-cyber class and yen carry overlay
        run: python v80_nato_backtest.py
      - name: Run exact half-year cohort benchmark including NATO
        run: python v80_nato_halfyear_cohorts.py
      - name: Audit Runaway Up and Runaway Down outputs including NATO
        run: python v80_runaway_audit.py
      - name: Validate point-in-time macro and yen carry coverage
        run: |
          python - <<'PY'
          import pandas as pd
          p='v80_results/macro_daily.csv'; m=pd.read_csv(p); dc='Date' if 'Date' in m.columns else m.columns[0]
          m[dc]=pd.to_datetime(m[dc],errors='coerce'); m=m.dropna(subset=[dc]).sort_values(dc)
          evalm=m[(m[dc]>=pd.Timestamp('2019-01-01'))&(m[dc]<=pd.Timestamp('2026-08-26'))].copy(); bad=[]
          def valid_span(c, latest_need='2026-07-31', first_need='2019-01-15', lo=None, hi=None):
              s=pd.to_numeric(evalm[c],errors='coerce') if c in evalm else pd.Series(dtype=float)
              z=evalm.loc[s.notna(),[dc]].copy(); z['v']=s[s.notna()].values
              first=z[dc].min() if len(z) else pd.NaT; last=z[dc].max() if len(z) else pd.NaT
              print(c,'non-null=',len(z),'first=',first,'last=',last,'min=',z.v.min() if len(z) else None,'max=',z.v.max() if len(z) else None)
              if len(z)==0 or first>pd.Timestamp(first_need) or last<pd.Timestamp(latest_need): bad.append((c,'coverage',first,last))
              if lo is not None and len(z) and (z.v<lo).any(): bad.append((c,'below_plausible_range',float(z.v.min())))
              if hi is not None and len(z) and (z.v>hi).any(): bad.append((c,'above_plausible_range',float(z.v.max())))
              for y in range(2019,2027):
                  q=z[z[dc].dt.year==y]
                  if y<2026 and len(q)<300: bad.append((c,f'year_{y}_coverage',len(q)))
              return s
          valid_span('BAMLH0A0HYM2',lo=0,hi=30); valid_span('DGS2',lo=-2,hi=20); valid_span('DGS10',lo=-2,hi=20); valid_span('DGS30',lo=-2,hi=20)
          valid_span('USDJPY',lo=50,hi=250)
          for c in ['CPI_YOY','CORE_CPI_YOY']:
              s=valid_span(c,latest_need='2026-06-30',first_need='2019-02-28',lo=-5,hi=15)
              z=evalm.loc[s.notna(),[dc]].copy(); z['v']=s[s.notna()].values; changes=z[z.v.ne(z.v.shift())][dc]
              if len(changes)<70: bad.append((c,'too_few_monthly_release_changes',len(changes)))
              if len(changes)>1 and changes.diff().dt.days.max()>70: bad.append((c,'release_gap_gt_70d',int(changes.diff().dt.days.max())))
          yen_req=['USDJPY_1D_PCT','USDJPY_5D_PCT','JPY_APPRECIATION_1D_PCT','JPY_APPRECIATION_5D_PCT','YEN_CARRY_CONFIRM_COUNT','YEN_CARRY_RISK_LEVEL','YEN_CARRY_HEADWIND','YEN_CARRY_VETO','YEN_CARRY_BUY_SCALE']
          missing=[c for c in yen_req if c not in evalm.columns]
          if missing: bad.append(('YEN_FIELDS_MISSING',missing))
          if not missing:
              level=pd.to_numeric(evalm['YEN_CARRY_RISK_LEVEL'],errors='coerce')
              scale=pd.to_numeric(evalm['YEN_CARRY_BUY_SCALE'],errors='coerce')
              if not level.dropna().isin([0,1,2,3]).all(): bad.append(('YEN_LEVEL_INVALID',sorted(level.dropna().unique().tolist())))
              if not scale.dropna().isin([0.0,0.5,0.75,1.0]).all(): bad.append(('YEN_SCALE_INVALID',sorted(scale.dropna().unique().tolist())))
              severe=evalm[level.eq(3)]
              if len(severe):
                  conf=pd.to_numeric(severe['YEN_CARRY_CONFIRM_COUNT'],errors='coerce')
                  if (conf<2).any(): bad.append(('YEN_LEVEL3_WITHOUT_2_CONFIRMATIONS',int((conf<2).sum())))
              print('Yen carry level counts=',level.value_counts(dropna=False).sort_index().to_dict())
          if bad:
              for b in bad: print('INVALID:',b)
              raise SystemExit(f'INVALID V80 RUN: macro/yen history incomplete or implausible; {bad[:12]}')
          print('Strict macro + yen carry coverage/plausibility validation passed')
          PY
      - name: Validate yen overlay on event outputs
        run: |
          python - <<'PY'
          import pandas as pd
          p='v80_results/ALL_events.csv'
          d=pd.read_csv(p)
          req=['yen_carry_buy_scale','yen_carry_risk_level','yen_carry_confirm_count','jpy_appreciation_1d_pct','jpy_appreciation_5d_pct']
          miss=[c for c in req if c not in d.columns]
          if miss: raise SystemExit(f'INVALID yen overlay output missing columns: {miss}')
          lvl=pd.to_numeric(d.yen_carry_risk_level,errors='coerce')
          sc=pd.to_numeric(d.yen_carry_buy_scale,errors='coerce')
          if not lvl.dropna().isin([0,1,2,3]).all(): raise SystemExit('INVALID yen carry risk level in events')
          if not sc.dropna().isin([0.0,0.5,0.75,1.0]).all(): raise SystemExit('INVALID yen carry buy scale in events')
          bad=d[(lvl>=3)&d.executed_state.isin(['LEFT_BUY','RIGHT_ADD'])]
          if len(bad): raise SystemExit(f'INVALID severe yen carry risk still allowed new buys: {len(bad)}')
          print('Yen event overlay validation passed; level counts=',lvl.value_counts().sort_index().to_dict())
          PY
      - name: Validate half-year benchmark definition and NATO history boundary
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('v80_results/halfyear_cohort_benchmark.csv')
          req=['asset','period','buy_hold_return','v80_return','dca_return_on_total_budget','dca_months_invested','v80_minus_bh_return_pp','v80_minus_bh_mdd_pp','is_incomplete_period']
          miss=[c for c in req if c not in d.columns]
          if miss: raise SystemExit(f'INVALID cohort output missing columns: {miss}')
          expected={'QQQ','VT','0050','VWRA','PPH','NATO'}
          if set(d.asset.unique()) != expected: raise SystemExit(f'INVALID assets: {set(d.asset.unique())}')
          bad=d[(~d.is_incomplete_period.astype(bool)) & (d.dca_months_invested != 6)]
          if len(bad): raise SystemExit(f'INVALID DCA installment count: {len(bad)}')
          stress=d[d.period.isin(['2020_H1','2022_H1','2022_H2'])]
          if len(stress) != 15: raise SystemExit(f'INVALID stress coverage: expected 15 rows from assets that existed then, got {len(stress)}')
          nato=d[d.asset.eq('NATO')].copy()
          if len(nato)==0: raise SystemExit('INVALID NATO history boundary: no NATO cohorts')
          pre=nato[nato.period<'2023_H2']
          if len(pre): raise SystemExit(f'INVALID NATO pre-inception cohorts: {pre.period.tolist()}')
          inc=nato[nato.period.eq('2023_H2')]
          if len(inc)!=1: raise SystemExit('INVALID NATO 2023H2 cohort cardinality')
          months=int(pd.to_numeric(inc.dca_months_invested,errors='coerce').iloc[0])
          incomplete=bool(inc.is_incomplete_period.astype(bool).iloc[0])
          if months==6 and incomplete: raise SystemExit('INVALID NATO 2023H2: six observed trading months must not be force-marked incomplete')
          if months<6 and not incomplete: raise SystemExit('INVALID NATO 2023H2: missing observed trading months must be incomplete')
          full=nato[~nato.is_incomplete_period.astype(bool)]
          expected_first='2023_H2' if months==6 else '2024_H1'
          if len(full)==0 or full.period.min()!=expected_first: raise SystemExit(f'INVALID NATO first full cohort: expected {expected_first}, got {full.period.tolist()}')
          print('Half-year cohort validation passed:',len(d),'rows; NATO 2023H2 observed months=',months,'first full cohort=',full.period.min(),'stress rows=',len(stress))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v80-formal-results
          path: v80_results/
          if-no-files-found: warn
