name: Mother Rule 33-Model Backtest

on:
  push:
    branches: [ master ]
    paths:
      - 'backtest_33_models.py'
      - '.github/workflows/backtest_33_models.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance

      - name: Run 33-model suite
        run: python backtest_33_models.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mother-rule-33-model-results
          path: backtest_33_output/
          if-no-files-found: warn
