name: V70.2 Macro-only Source QA

on:
  push:
    paths:
      - 'v70_macro_only_source_qa.py'
      - '.github/workflows/v70_macro_only_source_qa.yml'
  workflow_dispatch:

jobs:
  source-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - name: Run official-source QA
        run: python v70_macro_only_source_qa.py
      - name: Enforce required raw-source completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('v70_macro_source_qa_output/source_qa.json')
          report = json.loads(p.read_text(encoding='utf-8'))
          failed = [
              row for row in report.get('source_rows', [])
              if row.get('status') not in {'RAW_SOURCE_OK', 'RAW_SOURCE_OK_OFFICIAL_FALLBACK'}
          ]
          if failed:
              names = ', '.join(f"{r.get('logical_input')}={r.get('status')}" for r in failed)
              raise SystemExit(f'REQUIRED_RAW_SOURCE_QA_INCOMPLETE: {names}')
          print('Required raw official-source transport QA complete.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v70-macro-source-qa
          path: v70_macro_source_qa_output/
