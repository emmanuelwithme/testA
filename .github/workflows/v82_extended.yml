name: V82 Extended 2005-2026 Robustness Backtest
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'v82_backtest_extended.py'
      - 'v82_backtest_extended_adjusted.py'
      - '.github/workflows/v82_extended.yml'
      - 'v82_backtest_phase1.py'
      - 'v82_backtest_phase1_retry.py'
      - 'v80_macro.py'
      - 'investment_backtest.py'

jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance requests scikit-learn
      - name: Patch shared runtime compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('investment_backtest.py'); s=p.read_text()
          old="def asof_cols(base,other,prefix,cols):\n    tmp=other[cols].copy();tmp.columns=[prefix+c for c in cols];return pd.merge_asof(base.sort_index().reset_index().rename(columns={'index':'date'}),tmp.sort_index().reset_index().rename(columns={'index':'date'}),on='date',direction='backward').set_index('date')"
          new="def asof_cols(base,other,prefix,cols):\n    left=base.sort_index().copy(); left.index.name='date'; left=left.reset_index()\n    tmp=other[cols].copy(); tmp.columns=[prefix+c for c in cols]; tmp.index.name='date'; tmp=tmp.sort_index().reset_index()\n    left['date']=pd.to_datetime(left['date']); tmp['date']=pd.to_datetime(tmp['date'])\n    return pd.merge_asof(left.sort_values('date'),tmp.sort_values('date'),on='date',direction='backward').set_index('date')"
          if old in s:
              s=s.replace(old,new)
          elif "left.index.name='date'" not in s:
              raise SystemExit('asof_cols compatibility patch target not found')
          p.write_text(s)
          PY
      - name: Patch resilient extended T-bill source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v82_backtest_extended.py'); s=p.read_text()
          old="def fred_dtb3_long():\n    url = ('https://fred.stlouisfed.org/graph/fredgraph.csv?'\n           'id=DTB3&cosd=2004-01-01&coed=2026-08-31')\n    rr = requests.get(url, timeout=60, headers={'User-Agent':'Mozilla/5.0'})\n    rr.raise_for_status()\n    z = pd.read_csv(StringIO(rr.text))\n    z.columns = ['date','rate']\n    z['date'] = pd.to_datetime(z.date, errors='coerce')\n    z['rate'] = pd.to_numeric(z.rate, errors='coerce')\n    return z.dropna().set_index('date').rate.sort_index()\n"
          new="def fred_dtb3_long():\n    url = ('https://fred.stlouisfed.org/graph/fredgraph.csv?'\n           'id=DTB3&cosd=2004-01-01&coed=2026-08-31')\n    last = None\n    for wait in (0, 3, 8):\n        try:\n            if wait: time.sleep(wait)\n            rr = requests.get(url, timeout=120, headers={'User-Agent':'Mozilla/5.0'})\n            rr.raise_for_status()\n            z = pd.read_csv(StringIO(rr.text))\n            z.columns = ['date','rate']\n            z['date'] = pd.to_datetime(z.date, errors='coerce')\n            z['rate'] = pd.to_numeric(z.rate, errors='coerce')\n            out = z.dropna().set_index('date').rate.sort_index()\n            if len(out) < 1000: raise RuntimeError(f'DTB3 short series {len(out)}')\n            print('DTB3 source=FRED rows=', len(out), 'start=', out.index.min(), 'end=', out.index.max())\n            return out\n        except Exception as exc:\n            last = exc\n            print('WARN FRED DTB3 retry:', exc)\n    d = dl_long('^IRX', '2004-01-01', '2026-09-02')\n    out = pd.to_numeric(d.Close, errors='coerce').dropna().sort_index()\n    if len(out) < 1000: raise RuntimeError(f'DTB3 FRED failed ({last}); ^IRX fallback too short ({len(out)})')\n    print('DTB3 source=YAHOO_^IRX_FALLBACK rows=', len(out), 'start=', out.index.min(), 'end=', out.index.max())\n    return out\n"
          if old not in s:
              raise SystemExit('fred_dtb3_long patch target not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Run V82 extended 2005-2026 corporate-action-safe robustness test
        run: python v82_backtest_extended_adjusted.py
      - name: Validate extended outputs
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from pathlib import Path
          root=Path('v82_extended_results')
          req_files=['extended_actual_summary.csv','extended_actual_state_audit.csv','extended_data_boundary.csv','extended_stress_periods.csv','extended_proxy_status.csv']
          missing=[f for f in req_files if not (root/f).exists()]
          if missing: raise SystemExit(f'Missing extended outputs: {missing}')
          d=pd.read_csv(root/'extended_actual_summary.csv')
          expected={'QQQ','VT','0050','VWRA','PPH','SOXX'}
          if set(d.asset.unique())!=expected: raise SystemExit(f'Unexpected assets: {set(d.asset.unique())}')
          expected_strategies={'BUY_HOLD','DCA','V82_FIXED_RUN8'}
          for a in expected:
              got=set(d.loc[d.asset.eq(a),'strategy'])
              if got!=expected_strategies: raise SystemExit(f'{a} strategies invalid: {got}')
          numeric=['total_cost','final_asset','total_profit','total_return','xirr','max_drawdown','twr_cagr','avg_stock_exposure','avg_parking_exposure']
          arr=d[numeric].apply(pd.to_numeric,errors='coerce')
          if not np.isfinite(arr.to_numpy()).all(): raise SystemExit('NaN/Inf in extended core outputs')
          if (d.total_cost<=0).any() or (d.final_asset<=0).any(): raise SystemExit('Non-positive cost/asset')
          if ((d.avg_stock_exposure<0)|(d.avg_stock_exposure>1)).any(): raise SystemExit('Invalid stock exposure')
          if ((d.avg_parking_exposure<0)|(d.avg_parking_exposure>1)).any(): raise SystemExit('Invalid parking exposure')
          if ((d.avg_stock_exposure+d.avg_parking_exposure-1).abs()>1e-6).any(): raise SystemExit('Exposure sum != 1')
          bh=d[d.strategy.eq('BUY_HOLD')]
          if (bh.max_drawdown < -0.80).any():
              bad=bh.loc[bh.max_drawdown < -0.80,['asset','max_drawdown']].to_dict('records')
              raise SystemExit('Corporate-action/data sanity failure: implausible Buy&Hold MDD '+str(bad))
          b=pd.read_csv(root/'extended_data_boundary.csv')
          if set(b.asset)!=expected: raise SystemExit('Boundary assets incomplete')
          p=pd.read_csv(root/'extended_proxy_status.csv')
          if set(p.asset)!=expected: raise SystemExit('Proxy status assets incomplete')
          s=pd.read_csv(root/'extended_stress_periods.csv')
          if len(s)==0: raise SystemExit('Stress-period output empty')
          print('V82 EXTENDED CORE VALIDATION PASSED')
          print(d[['asset','strategy','total_cost','final_asset','xirr','max_drawdown','twr_cagr','recovery_days','avg_stock_exposure','avg_parking_exposure']].to_string(index=False))
          print('\nBOUNDARIES')
          print(b.to_string(index=False))
          print('\nPROXY STATUS')
          print(p.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v82-extended-results
          path: v82_extended_results/
          if-no-files-found: warn
