name: V82 Formal Deployment Backtest
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'v82_backtest_phase1.py'
      - 'v82_backtest_phase1_retry.py'
      - '.github/workflows/v82_backtest.yml'
      - 'investment_backtest.py'
      - 'v80_backtest.py'
      - 'v80_macro.py'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance requests scikit-learn
      - name: Patch shared runtime compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('investment_backtest.py'); s=p.read_text()
          s=s.replace("repair=True,timeout=30","repair=False,timeout=60")
          old="def asof_cols(base,other,prefix,cols):\n    tmp=other[cols].copy();tmp.columns=[prefix+c for c in cols];return pd.merge_asof(base.sort_index().reset_index().rename(columns={'index':'date'}),tmp.sort_index().reset_index().rename(columns={'index':'date'}),on='date',direction='backward').set_index('date')"
          new="def asof_cols(base,other,prefix,cols):\n    left=base.sort_index().copy(); left.index.name='date'; left=left.reset_index()\n    tmp=other[cols].copy(); tmp.columns=[prefix+c for c in cols]; tmp.index.name='date'; tmp=tmp.sort_index().reset_index()\n    left['date']=pd.to_datetime(left['date']); tmp['date']=pd.to_datetime(tmp['date'])\n    return pd.merge_asof(left.sort_values('date'),tmp.sort_values('date'),on='date',direction='backward').set_index('date')"
          if old in s: s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Run V82 phase1 deployment calibration
        run: python v82_backtest_phase1_retry.py
      - name: Validate required core outputs
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          p='v82_results/phase1_summary.csv'
          d=pd.read_csv(p)
          req=['asset','strategy','total_cost','final_asset','total_return','xirr','max_drawdown','avg_stock_exposure','avg_parking_exposure']
          miss=[c for c in req if c not in d.columns]
          if miss: raise SystemExit(f'Missing columns: {miss}')
          expected={'QQQ','VT','0050','VWRA','PPH','SOXX'}
          if set(d.asset.unique())!=expected: raise SystemExit(f'Unexpected assets: {set(d.asset.unique())}')
          expected_strategies={'BUY_HOLD','DCA','V82_SGOV'}
          for a in expected:
              s=set(d.loc[d.asset.eq(a),'strategy'])
              if s!=expected_strategies: raise SystemExit(f'{a} strategy set invalid: {s}')
          bad=d[d.total_cost!=8_000_000]
          if len(bad): raise SystemExit(f'Invalid total cost rows: {bad[["asset","strategy","total_cost"]].to_dict("records")}')
          numeric=['total_cost','final_asset','total_return','xirr','max_drawdown','avg_stock_exposure','avg_parking_exposure']
          arr=d[numeric].apply(pd.to_numeric,errors='coerce')
          invalid=~np.isfinite(arr.to_numpy())
          if invalid.any():
              rows=np.where(invalid.any(axis=1))[0]
              raise SystemExit('INVALID V82 RUN: NaN/Inf in core outputs: '+str(d.iloc[rows][['asset','strategy']+numeric].to_dict('records')))
          if ((d.avg_stock_exposure<0)|(d.avg_stock_exposure>1)|(d.avg_parking_exposure<0)|(d.avg_parking_exposure>1)).any():
              raise SystemExit('INVALID exposure outside [0,1]')
          if ((d.avg_stock_exposure+d.avg_parking_exposure-1).abs()>1e-6).any():
              raise SystemExit('INVALID stock+parking exposure != 1')
          if (d.final_asset<=0).any(): raise SystemExit('INVALID non-positive final asset')

          a=pd.read_csv('v82_results/state_audit.csv')
          audit_req=['asset','rows','raw_runaway_up','raw_runaway_down','exec_risk','exec_trim','exec_trend','exec_right','exec_base','exec_left','exec_deep','exec_extreme']
          missing=[c for c in audit_req if c not in a.columns]
          if missing: raise SystemExit(f'Missing state-audit columns: {missing}')
          if set(a.asset)!=expected: raise SystemExit(f'Unexpected state-audit assets: {set(a.asset)}')
          if (a.rows<=0).any(): raise SystemExit('INVALID state audit with zero rows')
          count_cols=[c for c in audit_req if c not in ['asset','rows']]
          if (a[count_cols]<0).any().any(): raise SystemExit('INVALID negative state count')
          zero_report={asset:[c for c in ['raw_runaway_up','raw_runaway_down','exec_trend','exec_right','exec_left'] if int(row[c])==0] for asset,row in a.set_index('asset').iterrows()}

          print('STRICT V82 core-output validation passed')
          print(d[req].to_string(index=False))
          print('\nV82 STATE AUDIT VALIDATION PASSED')
          print(a[audit_req].to_string(index=False))
          print('\nZERO-STATE REVIEW (zero can be legitimate, but must be reviewed):',zero_report)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v82-phase1-results
          path: v82_results/
          if-no-files-found: warn
